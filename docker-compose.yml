services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jenosize_crm
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d jenosize_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  crm_data:
